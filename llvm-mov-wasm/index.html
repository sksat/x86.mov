<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>llvm-mov-wasm</title>
<style>
  :root { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; line-height: 1.4; }
  body { margin: 0; padding: 1.5rem; }
  h1 { margin: 0 0 0.25rem; font-size: 1.4rem; }
  p.intro { margin: 0 0 1rem; color: #555; font-size: 0.9rem; }
  p.intro a { color: #06c; }
  .controls { display: flex; gap: 0.5rem; align-items: center; margin: 0.5rem 0; flex-wrap: wrap; }
  button, select { font: inherit; padding: 0.35rem 0.7rem; }
  button.primary { background: #1d6; border: 1px solid #0a5; color: white; cursor: pointer; }
  button.primary:disabled { background: #aaa; border-color: #888; cursor: wait; }
  textarea.in, pre.out {
    box-sizing: border-box;
    width: 100%;
    font: inherit;
    border: 1px solid #ccc;
    padding: 0.5rem;
    background: #fafafa;
    min-height: 22rem;
    max-height: 60vh;
    overflow: auto;
    white-space: pre;
    margin: 0;
    font-size: 0.85rem;
    resize: vertical;
  }
  pre.out { background: #f7f7f7; }
  .status { font-size: 0.85rem; color: #666; }
  .status.err { color: #b00; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
  @media (max-width: 800px) { .grid { grid-template-columns: minmax(0, 1fr); } }
  h2 { font-size: 0.95rem; margin: 0.5rem 0 0.25rem; color: #333; }
</style>
</head>
<body>
<h1>llvm-mov-wasm</h1>
<p class="intro">
  An out-of-tree LLVM backend (the sibling
  <a href="https://github.com/sksat/x86.mov/tree/mov/llvm-mov">llvm-mov</a>)
  ported to WebAssembly. Pastes LLVM IR on the left, emits mov-target
  x86-32 assembly on the right — entirely in the browser.
  See also <a href="../movfuscator-wasm/">movfuscator-wasm</a> (the
  LCC-based sibling).
</p>

<div class="controls">
  <button id="run" class="primary">Compile (.ll → .s)</button>
  <select id="example">
    <option value="ret_42">ret 42</option>
    <option value="add_one">add_one(i32)</option>
    <option value="bitand">bitand(i32, i32)</option>
  </select>
  <span class="status" id="status"></span>
</div>

<div class="grid">
  <div>
    <h2>LLVM IR (input)</h2>
    <textarea id="in" class="in" spellcheck="false"></textarea>
  </div>
  <div>
    <h2>mov-target x86-32 assembly (output)</h2>
    <pre id="out" class="out"></pre>
  </div>
</div>

<script type="module">
import { compile } from './llvm-mov.mjs';

const EXAMPLES = {
    ret_42: `target triple = "mov-unknown-linux-gnu"

define i32 @main() {
  ret i32 42
}
`,
    add_one: `target triple = "mov-unknown-linux-gnu"

define i32 @add_one(i32 %x) {
  %r = add i32 %x, 1
  ret i32 %r
}
`,
    bitand: `target triple = "mov-unknown-linux-gnu"

define i32 @bitand(i32 %a, i32 %b) {
  %r = and i32 %a, %b
  ret i32 %r
}
`,
};

const $in     = document.getElementById('in');
const $out    = document.getElementById('out');
const $run    = document.getElementById('run');
const $status = document.getElementById('status');
const $ex     = document.getElementById('example');

function loadExample() {
    $in.value = EXAMPLES[$ex.value] ?? '';
}
$ex.addEventListener('change', loadExample);
loadExample();

$run.addEventListener('click', async () => {
    $run.disabled = true;
    $status.className = 'status';
    $status.textContent = 'compiling…';
    const t0 = performance.now();
    try {
        const asm = await compile($in.value);
        $out.textContent = asm;
        const dt = (performance.now() - t0).toFixed(0);
        $status.textContent = `compiled in ${dt} ms`;
    } catch (e) {
        $out.textContent = '';
        $status.className = 'status err';
        $status.textContent = String(e.message || e);
    } finally {
        $run.disabled = false;
    }
});
</script>
</body>
</html>
