# Stage-8+ Rust example: AES-128 ECB single-block encrypt through the
# `aes` crate, no_std. Provides a compute-bound bench fixture whose
# Rust dependency graph (aes + cipher + generic-array + …) exercises a
# wider IR surface than the standalone fib_rec example.

[package]
name = "rust-mov-aes"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
# RustCrypto's aes crate. `default-features = false` opts out of
# runtime CPU-feature detection (aes-ni autoselect) so we always
# build the portable software path — that's the only thing
# `llvm-mov-llc` can compile anyway (no aesni intrinsics support).
aes = { version = "0.8", default-features = false }
cipher = { version = "0.4", default-features = false }

[profile.release]
panic = "abort"
# opt-level = 3 with a single CGU so rustc inlines the iterator /
# Zip / generic-array trait soup down to a small set of flat
# functions before llvm-mov-llc sees it. At opt-level=0 the
# per-method monomorphizations balloon to ~60 separate functions
# and the byte-chain mov-only legalize takes well over ten minutes
# to chew through — opt-level=3 collapses the encrypt path to
# <10 functions visible at the IR boundary.
opt-level = 3
overflow-checks = false
debug = false
strip = false
# No LTO: thin LTO splits the IR into per-crate `.rcgu.ll`
# artifacts whose names confuse run.sh's `ls -t | head -1`
# heuristic, and the largest file ends up being core's
# monomorphized soup rather than our crate. A single CGU keeps the
# pipeline a one-file feed into llvm-mov-llc.
lto = false
codegen-units = 1

[profile.dev]
panic = "abort"
overflow-checks = false
