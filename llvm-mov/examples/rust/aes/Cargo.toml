# Stage-8+ Rust example: AES-128 ECB single-block encrypt through the
# `aes` crate, no_std. Provides a compute-bound bench fixture whose
# Rust dependency graph (aes + cipher + generic-array + …) exercises a
# wider IR surface than the standalone fib_rec example.

[package]
name = "rust-mov-aes"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "rust-mov-aes"
path = "src/main.rs"

[lib]
crate-type = ["staticlib"]
path = "src/main.rs"

[dependencies]
# RustCrypto's aes crate. `default-features = false` opts out of
# runtime CPU-feature detection (aes-ni autoselect) so we always
# build the portable software path — that's the only thing
# `llvm-mov-llc` can compile anyway (no aesni intrinsics support).
aes = { version = "0.8", default-features = false }
cipher = { version = "0.4", default-features = false }

[profile.release]
panic = "abort"
# opt-level=3 + single CGU: rustc inlines the iterator / Zip /
# generic-array trait soup down to a small set of flat functions
# before llvm-mov-llc sees it. The trade-off is that the resulting
# aes_main has lots of per-byte SSA values that scalarizer + the
# byte-chain mov-only legalize have to expand individually —
# compile time is in the multi-minute range. See aes/src/lib.rs
# header for the full status; stage 6d (i8-promote-to-i32 work)
# is still required for AES to round-trip end-to-end.
opt-level = 3
overflow-checks = false
debug = false
strip = false
lto = false
codegen-units = 1

[profile.dev]
panic = "abort"
overflow-checks = false
