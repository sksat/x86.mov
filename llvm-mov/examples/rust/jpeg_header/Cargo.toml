# Sibling of `png_header/` — same word-read parsing style applied to
# JPEG marker scanning. Decodes only the SOI and SOF0 markers; no
# entropy-coded scan, no IDCT, no colour conversion.

[package]
name = "rust-mov-jpeg-header"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "rust-mov-jpeg-header"
path = "src/main.rs"

[lib]
crate-type = ["staticlib"]
path = "src/main.rs"

[profile.release]
panic = "abort"
opt-level = 0
overflow-checks = false
debug = false
strip = false
lto = false

[profile.dev]
panic = "abort"
overflow-checks = false
