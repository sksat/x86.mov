# Stage-6e indirect-call Rust example.
# Mirror of ../main/Cargo.toml — same panic=abort / opt-level=0 /
# overflow-checks=false profile shape.

[package]
name = "rust-mov-indirect-call"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "rust-mov-indirect-call"
path = "src/main.rs"

[lib]
crate-type = ["staticlib"]
path = "src/main.rs"

[profile.release]
panic = "abort"
opt-level = 0
overflow-checks = false
debug = false
strip = false
lto = false

[profile.dev]
panic = "abort"
overflow-checks = false
