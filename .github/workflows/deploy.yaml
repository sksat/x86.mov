name: deploy

on:
  push:
    branches: [mov]
  pull_request:
    branches: [mov]
  workflow_dispatch:

# Per-ref concurrency: a new push to the same branch/PR supersedes the
# in-flight deploy for that ref, but production (mov) and a PR preview
# don't fight each other.
concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 180   # cold llvm-mov-wasm build is ~90 min; cache hits drop us to <10 min
    permissions:
      contents: read
      pull-requests: write     # for sticking the preview URL on the PR
    # Skip deploys triggered by PRs from forks — they don't carry the
    # secrets and would only ever fail. Same-repo PRs (our current
    # workflow) and pushes to mov still run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v6.0.2

      # wrangler-action's `npx wrangler` install requires a real node
      # via actions/setup-node (the ubuntu-latest default node is too
      # locked-down for npx to install on demand without `--yes`).
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'

      # movie86/wasm builds movie86 (Rust) for wasm32 and ships through
      # wasm-bindgen-cli. The toolchain action pins the version + caches
      # the wasm32 target install. wasm-bindgen-cli install is cached on
      # the binstall artifact path so it doesn't recompile per deploy.
      - name: setup rust (stable + wasm32 target)
        uses: actions-rust-lang/setup-rust-toolchain@v1.16.1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          cache-workspaces: movie86/wasm

      - name: cache wasm-bindgen-cli
        uses: actions/cache@v5.0.5
        id: wbg-cache
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-${{ runner.os }}-0.2.122

      - name: install wasm-bindgen-cli
        if: steps.wbg-cache.outputs.cache-hit != 'true'
        working-directory: .
        run: cargo install wasm-bindgen-cli --version 0.2.122 --locked

      - name: install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              gcc-multilib libc6-dev-i386 time make patch

      # llvm-22-dev provides llvm-tblgen-22 (used by the emcmake LLVM
      # build) and the native llvm-mov-llc reference (via the sibling
      # ../llvm-mov build). clang-22 isn't strictly needed for deploy
      # but installs cheaply alongside.
      - name: install LLVM 22 from apt.llvm.org
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 22
          sudo apt-get install -y --no-install-recommends \
              llvm-22-dev clang-22 lld-22 \
              ninja-build cmake

      - name: cache emsdk
        uses: actions/cache@v5.0.5
        id: emsdk-cache
        with:
          path: ~/emsdk
          key: emsdk-${{ runner.os }}-v1-latest

      - name: install emsdk
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git $HOME/emsdk
          $HOME/emsdk/emsdk install latest
          $HOME/emsdk/emsdk activate latest

      # ----------------------- movfuscator-wasm side -----------------------

      # Shares the same cache key shape as the test workflow so the
      # heavy binutils build is reused across the two pipelines.
      - name: cache movfuscator-wasm vendor + binutils-as build
        uses: actions/cache@v5.0.5
        id: mfw-vendor-cache
        with:
          path: |
            movfuscator-wasm/vendor
            movfuscator-wasm/build/binutils-as
          key: vendor-${{ runner.os }}-${{ hashFiles('movfuscator-wasm/scripts/fetch.sh', 'movfuscator-wasm/scripts/build-native.sh', 'movfuscator-wasm/scripts/build-wasm-as.sh', 'movfuscator-wasm/patches/**') }}-v1

      - name: movfuscator-wasm setup
        if: steps.mfw-vendor-cache.outputs.cache-hit != 'true'
        working-directory: movfuscator-wasm
        run: make setup

      - name: movfuscator-wasm build (browser + link-libs)
        working-directory: movfuscator-wasm
        run: |
          make build-native
          make build-wasm-as
          make build-wasm-browser
          make build-wasm-as-browser
          make build-wasm-ld-browser
          make stage-link-libs

      - name: stage movfuscator-wasm into dist/
        working-directory: movfuscator-wasm
        run: make stage-deploy

      # ----------------------- movie86/wasm side ---------------------------

      - name: build movie86/wasm
        working-directory: movie86/wasm
        run: make build-wasm

      - name: stage movie86/wasm into dist/movie86/
        working-directory: movie86/wasm
        run: make stage-deploy

      # ----------------------- llvm-mov/wasm side --------------------------
      #
      # The emcmake LLVM+clang build is the slowest part of the deploy
      # pipeline by far. Same two-layer cache shape as the test workflow:
      # vendor (the cloned llvm-project, ~2.7 GB) and the build dir's
      # lib/bin/include/tools subset (the .a files + cmake config) keyed
      # on the build scripts. Cache hits drop the cold-build cost from
      # ~90 min to a few minutes of relink time.

      - name: cache llvm-mov/wasm vendor/llvm-project
        uses: actions/cache@v5.0.5
        id: lmw-vendor-cache
        with:
          path: llvm-mov/wasm/vendor
          key: llvm-mov-wasm-vendor-${{ runner.os }}-${{ hashFiles('llvm-mov/wasm/scripts/fetch.sh') }}-v1

      - name: cache llvm-mov/wasm build/llvm-wasm
        uses: actions/cache@v5.0.5
        id: lmw-build-cache
        with:
          path: |
            llvm-mov/wasm/build/llvm-wasm/lib
            llvm-mov/wasm/build/llvm-wasm/bin
            llvm-mov/wasm/build/llvm-wasm/include
            llvm-mov/wasm/build/llvm-wasm/tools
            llvm-mov/wasm/build/llvm-wasm/CMakeCache.txt
            llvm-mov/wasm/build/llvm-wasm/build.ninja
            llvm-mov/wasm/build/llvm-wasm/rules.ninja
            llvm-mov/wasm/build/llvm-wasm/.ninja_log
            llvm-mov/wasm/build/llvm-wasm/.ninja_deps
          key: llvm-mov-wasm-llvm-${{ runner.os }}-${{ hashFiles('llvm-mov/wasm/scripts/build-wasm-llvm.sh', 'llvm-mov/wasm/scripts/fetch.sh') }}-v1
          # The cached .a/.o files are a function of the vendored LLVM
          # source + the cmake flags, not the post-build short-circuit
          # logic. Falling back to any previous cache lets unrelated
          # script tweaks land without forcing a 90-min cold rebuild.
          restore-keys: |
            llvm-mov-wasm-llvm-${{ runner.os }}-

      - name: llvm-mov/wasm setup (fetch llvm-project)
        if: steps.lmw-vendor-cache.outputs.cache-hit != 'true'
        working-directory: llvm-mov/wasm
        run: make setup

      - name: llvm-mov/wasm build (LLVM+clang static libs)
        working-directory: llvm-mov/wasm
        run: make build-wasm-llvm

      # clang.{js,wasm} is purely a function of the vendored llvm-project
      # source (already keyed by fetch.sh) + the two link/build scripts.
      # When it cache-hits we skip ~15 min of wasm-opt on the em++ link;
      # llvm-mov-llc.wasm is built separately below so the backend
      # iteration loop is unaffected.
      - name: cache llvm-mov/wasm clang.wasm artifact
        uses: actions/cache@v5.0.5
        id: lmw-clang-cache
        with:
          path: |
            llvm-mov/wasm/build/clang.js
            llvm-mov/wasm/build/clang.wasm
            llvm-mov/wasm/build/clang.wasm.zst
            llvm-mov/wasm/build/clang.wasm.hash
            llvm-mov/wasm/build/package.json
          key: clang-wasm-${{ runner.os }}-${{ hashFiles('llvm-mov/wasm/scripts/build-wasm-clang.sh', 'llvm-mov/wasm/scripts/build-wasm-llvm.sh', 'llvm-mov/wasm/scripts/fetch.sh') }}-v1

      - name: llvm-mov/wasm build (clang driver wasm)
        if: steps.lmw-clang-cache.outputs.cache-hit != 'true'
        working-directory: llvm-mov/wasm
        run: make build-wasm-clang

      # Native llvm-mov-llc is a pure function of the backend sources
      # (llvm/, tools/) + the CMake/Makefile that drives them. The wasm
      # build script is excluded from this key because it only affects
      # the wasm artifact, not this native binary.
      - name: cache native llvm-mov-llc
        uses: actions/cache@v5.0.5
        id: lmw-native-llc-cache
        with:
          path: llvm-mov/build/bin/llvm-mov-llc
          key: llvm-mov-llc-native-${{ runner.os }}-${{ hashFiles('llvm-mov/llvm/**', 'llvm-mov/tools/**', 'llvm-mov/CMakeLists.txt', 'llvm-mov/Makefile') }}-v1

      - name: llvm-mov/wasm build (native llvm-mov-llc)
        if: steps.lmw-native-llc-cache.outputs.cache-hit != 'true'
        working-directory: llvm-mov/wasm
        run: make build-native-llvm-mov-llc

      # Wasm llvm-mov-llc is a function of the same backend sources
      # plus the emcmake link script. The build-wasm-llvm.sh artefacts
      # it consumes (build/llvm-wasm/lib/cmake/llvm) are already covered
      # by lmw-build-cache above, so they don't need to be in this key.
      - name: cache wasm llvm-mov-llc artifact
        uses: actions/cache@v5.0.5
        id: lmw-wasm-llc-cache
        with:
          path: |
            llvm-mov/wasm/build/llvm-mov-llc.js
            llvm-mov/wasm/build/llvm-mov-llc.wasm
            llvm-mov/wasm/build/package.json
          key: llvm-mov-llc-wasm-${{ runner.os }}-${{ hashFiles('llvm-mov/llvm/**', 'llvm-mov/tools/**', 'llvm-mov/CMakeLists.txt', 'llvm-mov/wasm/scripts/build-wasm-llvm-mov-llc.sh') }}-v1

      - name: llvm-mov/wasm build (wasm llvm-mov-llc driver)
        if: steps.lmw-wasm-llc-cache.outputs.cache-hit != 'true'
        working-directory: llvm-mov/wasm
        run: make build-wasm-llvm-mov-llc

      # Invoke the staging script directly instead of `make stage-deploy`.
      # The Makefile target declares `build` as a prerequisite, and `build`
      # is .PHONY — calling it would re-run the wasm + native llvm-mov-llc
      # builds even when both caches above hit, defeating the cache gates.
      # The fzstd-install guard from the Makefile is inlined here so the
      # script's `node_modules/fzstd/main.js` import still resolves.
      - name: stage llvm-mov/wasm into dist/llvm-mov/
        working-directory: llvm-mov/wasm
        run: |
          if [ ! -d node_modules/fzstd ]; then npm install; fi
          ./scripts/stage-deploy.sh

      # ----------------------- explorer side -------------------------------

      - name: explorer build (Vite + React)
        working-directory: explorer
        run: |
          npm ci
          npm run build

      - name: stage explorer into dist/explorer/
        working-directory: explorer
        run: make stage-deploy

      # ----------------------- upload + comment ----------------------------

      - name: upload to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # CF Pages production branch is configured on the dashboard
          # (currently `mov`). `--branch=<head-ref>` makes other refs
          # land as preview deployments at
          # <head-ref>.x86-mov.pages.dev. github.head_ref is set on PR
          # events, github.ref_name on push / workflow_dispatch.
          # NB: keep on one line — wrangler-action splits multi-line
          # command: blocks and silently drops anything after the first.
          command: pages deploy dist --project-name=x86-mov --branch=${{ github.head_ref || github.ref_name }}

      - name: comment preview URL on PR
        if: github.event_name == 'pull_request' && steps.deploy.outputs.deployment-url
        uses: actions/github-script@v9.0.0
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        with:
          script: |
            // Find an existing preview comment by its HTML-comment marker
            // and edit it in place; otherwise post fresh. Keeps the PR
            // thread from accumulating one comment per push.
            const marker = '<!-- cloudflare-pages-preview -->';
            const url = process.env.URL;
            const body = `${marker}\n🚀 **Preview deployed**: ${url}\n\n- Root: ${url}/\n- movfuscator-wasm demo: ${url}/movfuscator-wasm/\n- movie86 demo: ${url}/movie86/\n- llvm-mov demo: ${url}/llvm-mov/\n- explorer: ${url}/explorer/\n`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments, { owner, repo, issue_number }
            );
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
