name: deploy

on:
  push:
    branches: [mov]
  pull_request:
    branches: [mov]
  workflow_dispatch:

# Per-ref concurrency: a new push to the same branch/PR supersedes the
# in-flight deploy for that ref, but production (mov) and a PR preview
# don't fight each other.
concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: movfuscator-wasm

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write   # for sticking the preview URL on the PR
    # Skip deploys triggered by PRs from forks — they don't carry the
    # secrets and would only ever fail. Same-repo PRs (our current
    # workflow) and pushes to mov still run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v6.0.2

      # wrangler-action's `npx wrangler` install requires a real node
      # via actions/setup-node (the ubuntu-latest default node is too
      # locked-down for npx to install on demand without `--yes`).
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'

      - name: install host packages
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              gcc-multilib libc6-dev-i386 time make patch

      - name: cache emsdk
        uses: actions/cache@v5.0.5
        id: emsdk-cache
        with:
          path: ~/emsdk
          key: emsdk-${{ runner.os }}-v1-latest

      - name: install emsdk
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        working-directory: .
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git $HOME/emsdk
          $HOME/emsdk/emsdk install latest
          $HOME/emsdk/emsdk activate latest

      # Shares the same cache key shape as the test workflow so the
      # heavy binutils build is reused across the two pipelines.
      - name: cache vendor + binutils-as build
        uses: actions/cache@v5.0.5
        id: vendor-cache
        with:
          path: |
            movfuscator-wasm/vendor
            movfuscator-wasm/build/binutils-as
          key: |
            vendor-${{ runner.os }}-${{ hashFiles(
              'movfuscator-wasm/scripts/fetch.sh',
              'movfuscator-wasm/scripts/build-native.sh',
              'movfuscator-wasm/scripts/build-wasm-as.sh',
              'movfuscator-wasm/patches/**'
            ) }}-v1

      - name: setup
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: make setup

      - name: build everything needed for the demo
        run: |
          make build-native
          make build-wasm-as
          make build-wasm-browser
          make build-wasm-as-browser
          make build-wasm-ld-browser
          make stage-link-libs

      - name: stage dist/
        run: make stage-deploy

      - name: upload to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # CF Pages production branch is configured on the dashboard
          # (currently `mov`). `--branch=<head-ref>` makes other refs
          # land as preview deployments at
          # <head-ref>.x86-mov.pages.dev. github.head_ref is set on PR
          # events, github.ref_name on push / workflow_dispatch.
          # NB: keep on one line — wrangler-action splits multi-line
          # command: blocks and silently drops anything after the first.
          command: pages deploy ../dist --project-name=x86-mov --branch=${{ github.head_ref || github.ref_name }}
          workingDirectory: movfuscator-wasm

      - name: comment preview URL on PR
        if: github.event_name == 'pull_request' && steps.deploy.outputs.deployment-url
        uses: actions/github-script@v9.0.0
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        with:
          script: |
            // Find an existing preview comment by its HTML-comment marker
            // and edit it in place; otherwise post fresh. Keeps the PR
            // thread from accumulating one comment per push.
            const marker = '<!-- cloudflare-pages-preview -->';
            const url = process.env.URL;
            const body = `${marker}\n🚀 **Preview deployed**: ${url}\n\n- Root: ${url}/\n- movfuscator-wasm demo: ${url}/movfuscator-wasm/\n`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments, { owner, repo, issue_number }
            );
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
