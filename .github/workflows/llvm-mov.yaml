name: llvm-mov

on:
  push:
    branches: [mov]
  pull_request:
    branches: [mov]
  workflow_dispatch:

defaults:
  run:
    working-directory: llvm-mov

# Avoid stomping deploys: per-ref so a new push to a PR/branch supersedes
# the in-flight run for that ref but production (mov) and PR previews
# don't fight each other.
concurrency:
  group: llvm-mov-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6.0.2

      # llvm-19 is the latest distro `apt` carries on ubuntu-24.04 (and on
      # Debian 13). We pin to 22 from apt.llvm.org — bumping in lockstep
      # with upstream is cheap before the backend has shape, and the matching
      # cmake config dir is the one CMakeLists.txt expects.
      - name: install LLVM 22 from apt.llvm.org
        working-directory: .
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 22
          sudo apt-get install -y --no-install-recommends \
              llvm-22-dev clang-22 lld-22 \
              ninja-build cmake \
              gcc-multilib libc6-dev-i386

      # The cmake build artefacts are deterministic in (LLVM headers ×
      # llvm-mov sources). Keying on both keeps the cache from sticking
      # to a stale LLVM patch revision.
      - name: cache build/
        uses: actions/cache@v5.0.5
        with:
          path: llvm-mov/build
          key: llvm-mov-build-${{ runner.os }}-llvm22-${{ hashFiles('llvm-mov/CMakeLists.txt', 'llvm-mov/llvm/**', 'llvm-mov/tools/**') }}
          # Restoring a partial match is fine; ninja will rebuild what
          # changed and the test stage doesn't trust the cache for results.
          restore-keys: |
            llvm-mov-build-${{ runner.os }}-llvm22-

      - name: configure + build
        run: make build

      - name: test (execution)
        run: make test-exec

      - name: test (mov-only gate)
        run: make test-mov-only

      # Stage 6.5 — rustc → llvm-mov-llc → ELF end-to-end. The ubuntu-24.04
      # runner already ships with a recent rustup-managed rustc, but the
      # i686 std rlibs are not preinstalled. Adding the target is ~10 MB
      # and cached implicitly by the rustup install.
      - name: install i686 rust-std (for examples/rust)
        run: rustup target add i686-unknown-linux-gnu

      - name: test-rust-example (stage 6.5)
        run: make test-rust-example

      # bench-check (regression test against committed bench/results.md)
      # ──────────────────────────────────────────────────────────────────
      # Requires the native movfuscator (`movcc`) and hyperfine. The
      # movfuscator build clones upstream + builds LCC + softfloat, ~1
      # minute on a cold cache; we cache the vendor checkout + build
      # outputs keyed on the patch set and pinned commit so subsequent
      # runs skip the rebuild entirely.

      - name: cache movfuscator-wasm/vendor + build
        uses: actions/cache@v5.0.5
        with:
          path: |
            movfuscator-wasm/vendor
          key: movfuscator-vendor-${{ runner.os }}-${{ hashFiles('movfuscator-wasm/scripts/fetch.sh', 'movfuscator-wasm/patches/**') }}

      - name: build native movfuscator (for bench)
        working-directory: movfuscator-wasm
        run: |
          if [ ! -x vendor/movfuscator/build/movcc ]; then
            make setup build-native
          else
            echo "movfuscator already built (cache hit)"
          fi

      - name: install hyperfine (for bench runtime measurement)
        working-directory: .
        run: sudo apt-get install -y --no-install-recommends hyperfine

      - name: bench regression check
        run: make bench-check
