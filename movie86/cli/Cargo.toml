[package]
name = "movie86-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "CLI driver for movie86 — load and run a mov-heavy ELF32 i386 binary"

[[bin]]
name = "movie86"
path = "src/main.rs"

[dependencies]
movie86 = { path = "../core" }
# gdb Remote Serial Protocol server. movie86-cli only — the `movie86`
# library crate stays dep-free + no_std. Smart-friend's review pinned
# the trade-off: rolling our own RSP would be much more than the
# obvious 400 LOC once you handle ACK / partial reads / Ctrl-C /
# target.xml / etc.
gdbstub = "0.7.10"
gdbstub_arch = "0.3.3"

[lints]
workspace = true
